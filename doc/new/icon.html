<script src="BJUI/plugins/clipboard/clipboard.min.js"></script>
<style>
  .bjui-doc-icon .i-code {
    display: none;
  }
  .bjui-doc-icon .row-icon {
    display: inline;
  }
  .bjui-doc-icon .i-name {
    display: block;
  }
  .bjui-doc-icon i {
    font-size: 20px;
  }
  .bjui-doc-icon .span3 {
    display: inline-block;
    padding: 5px;
    border: 1px solid #dfdddd;
    margin: 5px;
    cursor: pointer;
    text-align: center;
    min-width: 195px;
  }
  .bjui-doc-icon .span3:hover {
    opacity: .8;
  }
</style>
<div class="bjui-pageContent">
  <div class="bjui-doc bjui-doc-icon">
    <h3>内置图标
      <span class="label label-success">v1.7.0+</span>
    </h3>
    <small
      class="text-muted">v1.7.0+版本以上内置了图标替换原系统内fontawesome图标，现在系统可以不加载fontawesome图标，<strong>注意首页相关fa图标需要替换</strong>,图标由<a
      href="https://fontello.com/" target="_blank">fontello</a>提取</small>
    <hr>
    <div class="section" data-filter="icon-box">
    </div>
  </div>

</div>
<div class="bjui-pageFooter">
  <ul>
    <li>
      <button type="button" class="btn btn-danger" data-toggle="closeBtn">关闭</button>
    </li>
  </ul>
</div>
<script>
  (function () {
    var $box = $.CurrentNavtab

    $.ajax({
      url: 'BJUI/themes/bjicon/config.json?v=' + (new Date().getTime()),
      success: function (res) {
        var $iconBox = $box.findFilter('icon-box')
        if ($iconBox.length) {
          var icon = res.glyphs || []
          var html = ''
          icon.forEach(function(val) {
            var name = 'bjicon-'+ val.css
            html += '<div class="span3"><i class="'+ name +'"></i><span class="i-name">'+name+'</span></div>'
          })

          $iconBox.html(html)
        }

      }
    })

    $box.find('.bjui-doc-icon').on('click', '.span3', function () {
      ClipboardJS.copy($(this).find('i').attr('class'))
      $(this).alertmsg('info', '复制成功')
    })
  }())
</script>
