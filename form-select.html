<div class="bjui-pageContent">
  <form action="ajaxDone1.html" id="j_form_form" class="pageForm" data-toggle="validate">
    <div style="margin:15px auto 0; width:800px;">
      <fieldset>
        <legend>下拉选择框
          <span class="subheader">tom-select</span>
        </legend>
        <div class="alert alert-warning form-inline"><i class="fa fa-warning"></i>
          <strong>更多参数：</strong>详见 <a href="https://tom-select.js.org/" target="_blank">https://tom-select.js.org/</a>
        </div>
        <table class="table table-condensed table-hover">
          <thead>
          <tr>
            <th width="125"></th>
            <th>样例</th>
            <th>属性</th>
          </tr>
          </thead>
          <tbody>
          <tr>
            <td align="right"><label class="label-control">自动宽高：</label></td>
            <td>
              <select data-toggle="selectpicker">
                <option value="">全部</option>
                <option value="1">下拉选项1</option>
                <option value="2" selected>下拉选项2</option>
                <option value="3">下拉选项3</option>
                <option value="4">下拉选项4</option>
              </select>
            </td>
            <td>data-toggle="selectpicker"</td>
          </tr>
          <tr>
            <td align="right"><label class="label-control">固定宽度：</label></td>
            <td>
              <select data-toggle="selectpicker" style="width: 200px">
                <option value="">全部</option>
                <option value="1">下拉选项1</option>
                <option value="2" selected>下拉选项2</option>
                <option value="3">下拉选项3</option>
                <option value="4">下拉选项4</option>
              </select>
            </td>
            <td>data-toggle="selectpicker" style="width: 200px"</td>
          </tr>
          <tr>
            <td align="right"><label class="label-control">多选：</label></td>
            <td>
              <select data-toggle="selectpicker" multiple style="width: 240px;">
                <option value="">全部</option>
                <option value="崇明">崇明</option>
                <option value="黄浦">黄浦</option>
                <option value="卢湾">卢湾</option>
                <option value="徐汇">徐汇</option>
                <option value="长宁">长宁</option>
                <option value="静安">静安</option>
                <option value="普陀">普陀</option>
                <option value="闸北">闸北</option>
                <option value="虹口">虹口</option>
                <option value="杨浦">杨浦</option>
                <option value="闵行">闵行</option>
                <option value="宝山">宝山</option>
                <option value="嘉定">嘉定</option>
                <option value="浦东">浦东</option>
                <option value="金山">金山</option>
                <option value="松江">松江</option>
                <option value="青浦">青浦</option>
                <option value="南汇">南汇</option>
                <option value="奉贤">奉贤</option>
                <option value="朱家角">朱家角</option>
              </select>
            </td>
            <td>data-toggle="selectpicker" multiple</td>
          </tr>
          <tr>
            <td align="right"><label class="label-control">禁用：</label></td>
            <td>
              <select data-toggle="selectpicker" data-width="200" disabled>
                <option value="">全部</option>
                <option value="1">下拉选项1</option>
                <option value="2" selected>下拉选项2</option>
                <option value="3">下拉选项3</option>
                <option value="4">下拉选项4</option>
              </select>
            </td>
            <td>disabled</td>
          </tr>

          </tbody>
        </table>
      </fieldset>
    </div>
  </form>
</div>
<div class="bjui-pageFooter">
  <ul>
    <li>
      <button type="button" class="btn btn-danger" data-toggle="closeBtn">关闭</button>
    </li>
  </ul>
</div>
